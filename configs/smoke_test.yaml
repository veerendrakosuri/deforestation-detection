project:
  name: deforestation-detection-smoke-test
  random_seed: 7

region:
  name: synthetic
  bbox_wgs84: [-63.5, -10.0, -63.48, -9.98]

imagery:
  collection: COPERNICUS/S2_SR_HARMONIZED
  bands: [B2, B3, B4, B8, B11, B12]
  cloud_probability_limit: 20
  pixel_size_m: 10
  crs: EPSG:32720
  before:
    start: "2019-07-01"
    end: "2019-08-31"
  after:
    start: "2024-07-01"
    end: "2024-08-31"

labels:
  collection: GOOGLE/DYNAMICWORLD/V1
  class_name: trees
  tree_probability_threshold: 0.5

baseline:
  ndvi_threshold: 0.5

tiling:
  tile_size: 32
  stride: 32
  test_fraction: 0.2
  validation_fraction: 0.1
  split_axis: x
  minimum_valid_fraction: 0.95

change_detection:
  minimum_patch_pixels: 50
  connectivity: 8

training:
  model: tiny-unet
  encoder: resnet34
  encoder_weights: none
  batch_size: 4
  epochs: 5
  learning_rate: 0.003
  weight_decay: 0.0001
  prediction_threshold: 0.5
  base_channels: 4

