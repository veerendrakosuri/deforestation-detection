name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the real workflow or user need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired inputs, outputs, and command or API behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation considerations
      description: Note relevant regions, seasons, datasets, or scientific limitations.
